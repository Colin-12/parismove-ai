[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parismove-ml-pollution"
version = "0.1.0"
description = "Modèle ML XGBoost pour la prédiction de PM2.5 à H+1"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "joblib>=1.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "click>=8.1",
    "structlog>=24.1",
    "parismove-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ml-pollution = "ml_pollution.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ml_pollution --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
    "sklearn",
    "sklearn.*",
    "xgboost",
    "xgboost.*",
    "joblib",
    "joblib.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false
